name: Release Desktop App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact_name: mac-build
            artifact_path: dist/*.dmg
            build_command: pnpm exec electron-builder --mac dmg --publish never
          - os: windows-latest
            artifact_name: windows-build
            artifact_path: dist/*.exe
            build_command: pnpm exec electron-builder --win nsis --publish never

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm vite build

      - name: Cleanup stale DMG mounts
        if: ${{ matrix.os == 'macos-latest' }}
        run: |
          hdiutil info | awk '/\/Volumes\// {print $1}' | while read -r disk; do
            hdiutil detach -force "$disk" || true
          done

      - name: Package app
        run: ${{ matrix.build_command }}

      - name: Upload packaged app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download mac artifact
        uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: release-assets

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
